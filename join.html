<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<title>1000억 함께 채우기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="theme.css?v=1125125500">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--text); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none; }
.bg { position: fixed; inset: 0; background: radial-gradient(120% 60% at 50% -10%, rgba(76,141,255,.35), transparent 60%), var(--bg); /* 옛 아이폰용 */
  background:
  radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--brand) 38%, transparent), transparent 60%),
  radial-gradient(90% 50% at 50% 110%, color-mix(in srgb, var(--brand-2) 30%, transparent), transparent 70%), var(--bg); }
.app { position: relative; height: 100%; display: flex; flex-direction: column; padding: max(18px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: center; }
.co { font-size: 15px; font-weight: 700; } .ev { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.conn { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); padding: 7px 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.conn i { width: 7px; height: 7px; border-radius: 50%; background: #f5a524; }
.conn.on i { background: #2fd27a; box-shadow: 0 0 8px #2fd27a; }

.status { margin-top: 22px; padding: 18px 18px 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(10px); }
.status .row { display: flex; justify-content: space-between; align-items: baseline; }
.status .lab { font-size: 13px; color: var(--text-2); font-weight: 600; }
.status .amt { font-size: 30px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 4px; }
.status .amt small { font-size: 17px; font-weight: 700; margin-left: 3px; color: var(--text-2); }
.status .ppl { font-size: 13px; color: var(--text-2); } .status .ppl b { color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; }
.bar { margin-top: 12px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; transform-origin: 0 50%; transform: scaleX(0); border-radius: 99px; background: linear-gradient(90deg, var(--brand), var(--brand-2), var(--accent)); transition: transform .35s ease-out; }
body.hold .bar i, body.done .bar i { background: linear-gradient(90deg, var(--gold-3), var(--gold-2), var(--gold-1)); }

.stagearea { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-height: 0; }
.hint { font-size: 17px; color: var(--text-2); font-weight: 600; text-align: center; min-height: 26px; transition: color .3s; }
.hint b { color: var(--text); }
.btnwrap { position: relative; width: min(72vw, 300px, 46vh); aspect-ratio: 1; margin: 26px 0 22px; }
.ring { position: absolute; inset: -14px; border-radius: 50%; border: 1.5px solid rgba(120,160,255,.45); border: 1.5px solid color-mix(in srgb, var(--brand) 45%, transparent); animation: ringP 2.2s ease-out infinite; pointer-events: none; }
.ring.r2 { animation-delay: 1.1s; }
@keyframes ringP { from { transform: scale(.92); opacity: .9; } to { transform: scale(1.22); opacity: 0; } }
#tap { position: absolute; inset: 0; border: 0; border-radius: 50%; cursor: pointer; color: #fff; font-family: inherit;
  background: radial-gradient(circle at 50% 30%, #8fb6ff 0%, var(--brand) 45%, var(--brand-2) 100%); box-shadow: 0 24px 60px rgba(76,141,255,.45); /* 옛 아이폰용 */
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, #fff 26%, var(--brand)) 0%, var(--brand) 45%, color-mix(in srgb, var(--brand-2) 85%, #000) 100%);
  box-shadow: 0 24px 60px color-mix(in srgb, var(--brand) 45%, transparent), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -10px 30px rgba(0,0,0,.25);
  transition: transform .09s ease-out, box-shadow .09s, filter .3s; touch-action: none; overflow: hidden; }
#tap .big { display: block; font-size: 46px; font-weight: 800; letter-spacing: -.03em; pointer-events: none; }
#tap .sm { display: block; font-size: 15px; font-weight: 600; opacity: .8; margin-top: 4px; pointer-events: none; }
#tap.down { transform: scale(.93); box-shadow: 0 10px 30px color-mix(in srgb, var(--brand) 45%, transparent), inset 0 2px 0 rgba(255,255,255,.25), inset 0 -4px 20px rgba(0,0,0,.3); }
#tap:disabled { filter: saturate(.2) brightness(.55); }
body.hold #tap:disabled, body.done #tap:disabled { filter: none; background: radial-gradient(circle at 50% 30%, var(--gold-1), var(--gold-2) 50%, var(--gold-3)); color: #3a2600; box-shadow: 0 24px 60px rgba(255,211,107,.4); box-shadow: 0 24px 60px color-mix(in srgb, var(--gold-2) 40%, transparent), inset 0 2px 0 rgba(255,255,255,.5); }
body.hold .ring, body.done .ring { border-color: color-mix(in srgb, var(--gold-2) 55%, transparent); }
.rip { position: absolute; width: 20px; height: 20px; margin: -10px; border-radius: 50%; background: rgba(255,255,255,.45); pointer-events: none; animation: rip .55s ease-out forwards; }
@keyframes rip { to { transform: scale(16); opacity: 0; } }
.plus { position: fixed; font-size: 22px; font-weight: 800; color: #fff; pointer-events: none; animation: plus .7s cubic-bezier(.2,.8,.2,1) forwards; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
@keyframes plus { to { transform: translate(var(--dx), -90px) scale(1.2); opacity: 0; } }

.mine { display: flex; gap: 10px; width: 100%; }
.mine > div { flex: 1; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.mine .lab { font-size: 12px; color: var(--text-2); font-weight: 600; }
.mine .v { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; letter-spacing: -.02em; }
.mine .v.pop { animation: vpop .18s ease-out; }
@keyframes vpop { 50% { transform: scale(1.08); } }
.mine .v small { font-size: 14px; color: var(--text-2); margin-left: 2px; }

.sian { position: fixed; right: 12px; bottom: max(10px, env(safe-area-inset-bottom)); font-size: 10px; font-weight: 700; letter-spacing: .1em; color: rgba(255,255,255,.4); padding: 4px 8px; border: 1px solid rgba(255,255,255,.15); border-radius: 6px; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="fx"></canvas>
<div class="app">
  <div class="top">
    <div><div class="co" data-cfg="companyName"></div><div class="ev" data-cfg="eventTitle"></div></div>
    <div class="conn" id="conn"><i></i><span id="connTxt">연결 중</span></div>
  </div>

  <div class="status">
    <div class="row"><span class="lab">지금 모인 금액</span><span class="ppl">참여 <b id="ppl">0</b>명</span></div>
    <div class="amt"><span id="amt">0</span><small>억 원</small></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="stagearea">
    <div class="hint" id="hint">버튼을 <b>최대한 빠르게</b> 눌러 주세요</div>
    <div class="btnwrap"><div class="ring"></div><div class="ring r2"></div>
      <button id="tap" aria-label="누르기"><span class="big" id="tapBig">TAP!</span><span class="sm" id="tapSm">연타할수록 빨라져요</span></button>
    </div>
    <div class="mine">
      <div><div class="lab">내가 누른 횟수</div><div class="v" id="my">0<small>번</small></div></div>
      <div><div class="lab">전체 탭</div><div class="v" id="all">0<small>번</small></div></div>
    </div>
  </div>
</div>
<div class="sian"></div>

<script src="lib/mqtt.min.js"></script>
<script src="config.js?v=1125125500"></script>
<script src="common.js?v=1125125500"></script>
<script>
(function () {
  const { CFG, ROOM, rid, createBus, fmt, Sound, FX, clamp, applyBrand } = window.EVG;
  const $ = id => document.getElementById(id);
  applyBrand();
  let myId; try { myId = localStorage.getItem('evg_id_' + ROOM); if (!myId) { myId = rid(10); localStorage.setItem('evg_id_' + ROOM, myId); } } catch (e) { myId = rid(10); }
  let my = 0, pending = 0, ph = 'ready', ep = null, lastState = 0, online = false;
  const fx = new FX($('fx'));

  const bus = createBus({
    subs: ['state'],
    onStatus: s => { online = s === 'online'; $('conn').classList.toggle('on', online); $('connTxt').textContent = online ? '연결됨' : s === 'connecting' ? '연결 중' : '다시 연결 중'; if (online) hello(); },
    onMessage: (k, m) => { if (k === 'state') apply(m); }
  });
  function hello() { bus.send('in', { t: 'hi', id: myId }); }
  setInterval(hello, 15000);

  function apply(m) {
    if (!m.ts || Math.abs(Date.now() - m.ts) > 60000) return waiting(); /* 예전 행사 기록은 무시 */
    const wasStale = stale; stale = false; lastState = Date.now();
    if (ep !== null && m.ep !== ep) { my = 0; pending = 0; setMy(); }
    if (ep !== m.ep) { ep = m.ep; hello(); }
    $('amt').textContent = (m.a >= CFG.goal ? fmt(m.a) : Math.floor(m.a).toLocaleString('ko-KR'));
    $('ppl').textContent = fmt(m.pp); $('all').innerHTML = fmt(m.tp) + '<small>번</small>';
    $('bar').style.transform = `scaleX(${clamp(m.a / CFG.goal, 0, 1)})`;
    if (m.ph !== ph || wasStale) setPhase(m.ph);
  }
  let stale = false;
  function waiting() { stale = true; if (ph !== 'ready') setPhase('ready'); $('hint').innerHTML = '메인 화면이 켜지면 <b>바로 시작돼요</b>'; }
  setInterval(() => { if (lastState && Date.now() - lastState > 8000 && (stale = true)) $('hint').innerHTML = '메인 화면 신호를 기다리는 중…'; }, 2000);
  function setPhase(p) {
    const prev = ph; ph = p; document.body.className = p;
    const tap = $('tap');
    tap.disabled = p === 'hold' || p === 'done';
    if (p === 'ready' || p === 'run') { $('tapBig').textContent = 'TAP!'; $('tapSm').textContent = '연타할수록 빨라져요'; $('hint').innerHTML = '버튼을 <b>최대한 빠르게</b> 눌러 주세요'; }
    if (p === 'hold') { $('tapBig').textContent = '999억'; $('tapSm').textContent = '이제 대표님 차례!'; $('hint').innerHTML = '<b>무대를 봐 주세요</b> · 마지막 1억은 대표님이'; if (navigator.vibrate) navigator.vibrate([30, 60, 30]); }
    if (p === 'done') {
      $('tapBig').textContent = '1000억'; $('tapSm').textContent = '달성!'; $('hint').innerHTML = '<b>함께해 주셔서 고마워요</b>';
      if (prev !== 'done') {
        if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 200]);
        const cs = getComputedStyle(document.documentElement), c = n => cs.getPropertyValue(n).trim();
        const cols = [c('--gold-1'), c('--gold-2'), c('--gold-3'), c('--brand'), c('--accent'), '#fff'];
        fx.confetti(90, { x: fx.w / 2, y: fx.h * .55, vy: -900, spread: 2.2, colors: cols });
        setTimeout(() => fx.confetti(70, { colors: cols }), 900);
      }
    }
  }

  function setMy() { const v = $('my'); v.innerHTML = fmt(my) + '<small>번</small>'; v.classList.remove('pop'); void v.offsetWidth; v.classList.add('pop'); }
  const tap = $('tap');
  tap.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (tap.disabled) return;
    Sound.unlock();
    my++; pending++; setMy();
    if (navigator.vibrate) navigator.vibrate(12);
    Sound.tap();
    tap.classList.add('down'); clearTimeout(tap._t); tap._t = setTimeout(() => tap.classList.remove('down'), 90);
    const r = tap.getBoundingClientRect();
    const rp = document.createElement('i'); rp.className = 'rip'; rp.style.left = (e.clientX - r.left) + 'px'; rp.style.top = (e.clientY - r.top) + 'px';
    tap.appendChild(rp); setTimeout(() => rp.remove(), 600);
    const pl = document.createElement('div'); pl.className = 'plus'; pl.textContent = '+1';
    pl.style.left = (e.clientX - 12) + 'px'; pl.style.top = (e.clientY - 30) + 'px'; pl.style.setProperty('--dx', ((Math.random() - .5) * 60) + 'px');
    document.body.appendChild(pl); setTimeout(() => pl.remove(), 750);
    if (my % 10 === 0) fx.spark(e.clientX, e.clientY, { n: 14, speed: 260, colors: ['#fff', getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()], life: .6, size: 2, g: 300 });
  }, { passive: false });
  ['pointerup', 'pointercancel', 'contextmenu'].forEach(ev => tap.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  /* 0.5초마다 모아서 보내기 (300명 동시 연타 대비) */
  setInterval(() => { if (pending > 0) { bus.send('in', { t: 'tap', id: myId, n: Math.min(pending, 60) }); pending = 0; } }, 500);
})();
</script>
</body>
</html>
